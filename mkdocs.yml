site_name: pyhofa — Higher-Order Factor Analysis for Python
site_url: https://gabintb.github.io/pyhofa/
repo_url: https://github.com/GabinTB/pyhofa
repo_name: pyhofa
site_description: >
  Higher-order multi-cumulant factor analysis in Python — a port of Guanglin Huang's hofa R package.

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: guide/installation.md
    - Quick Start: guide/quickstart.md
  - User Guide:
    - Factor Selection: guide/selection.md
    - Estimators (PCA / ML / GMM / ALS): guide/estimators.md
    - Adaptive HFA & Rolling Estimation: guide/adaptive.md
    - Portfolio Optimization: guide/portfolio.md
    - Simulation: guide/simulation.md
    - R Package Mapping & Corrections: guide/r-mapping.md
  - API Reference:
    - pyhofa.selection: api/selection.md
    - pyhofa.estimators: api/estimators.md
    - pyhofa.adaptive: api/adaptive.md
    - pyhofa.alignment: api/alignment.md
    - pyhofa.projection: api/projection.md
    - pyhofa.portfolio: api/portfolio.md
    - pyhofa.moments: api/moments.md
    - pyhofa.simulation: api/simulation.md
